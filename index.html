<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>Caja Boutique</title>
<meta name="theme-color" content="#1E4D6B">
<style>
/* Concepto: app de mostrador. Encabezado de marca arriba, trabajo en tarjetas claras, navegación fija abajo para el pulgar. */
:root{
  /* ===== PERSONALIZA LA MARCA AQUÍ (o desde Ajustes > Tienda) ===== */
  --brand-l:#1E4D6B;      /* color corporativo en tema claro */
  --brand-l-ink:#FFFFFF;  /* texto sobre el color corporativo */
  --brand-d:#7DB8DB;      /* color corporativo en tema oscuro */
  --brand-d-ink:#0B1A24;
  --accent:#E0A526;       /* color de acento (botones de cobro) */
  --accent-ink:#1B1405;
  /* ================================================================ */
  --brand:var(--brand-l);--brand-ink:var(--brand-l-ink);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --bg:#F2F4F6;--surface:#FFFFFF;--surface2:#E9EEF2;--fg:#14202B;--muted:#58697A;--line:#D5DDE4;
  --ok:#16794A;--ok-bg:#DDF3E7;--warn:#7A4E00;--warn-bg:#FFEFC7;--bad:#B3261E;--bad-bg:#FBE0DD;
  --shadow:0 1px 2px rgba(20,32,43,.08),0 8px 20px rgba(20,32,43,.06);
  --r:14px;--navh:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:var(--brand-d);--brand-ink:var(--brand-d-ink);
  --bg:#0E151B;--surface:#16202A;--surface2:#1F2C38;--fg:#E7EDF2;--muted:#93A4B3;--line:#2B3A47;
  --ok:#58D391;--ok-bg:#12301F;--warn:#F2C45C;--warn-bg:#35290B;--bad:#FF8A80;--bad-bg:#3A1714;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:var(--brand-d);--brand-ink:var(--brand-d-ink);
  --bg:#0E151B;--surface:#16202A;--surface2:#1F2C38;--fg:#E7EDF2;--muted:#93A4B3;--line:#2B3A47;
  --ok:#58D391;--ok-bg:#12301F;--warn:#F2C45C;--warn-bg:#35290B;--bad:#FF8A80;--bad-bg:#3A1714;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.4}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--brand)}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h2{font-size:1.2rem}h3{font-size:1.05rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.main{padding-top:16px;padding-bottom:calc(var(--navh) + 40px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}
.muted{color:var(--muted)}.sm{font-size:.875rem}
.eyebrow{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ic{flex:none;display:block}

/* encabezado */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--brand);color:var(--brand-ink)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:60px;padding-top:8px;padding-bottom:8px}
.logo{width:44px;height:44px;border-radius:10px;flex:none;object-fit:contain;background:#fff}
.logo-ph{display:grid;place-items:center;border:2px dashed currentColor;opacity:.75;font-size:.62rem;font-weight:700;letter-spacing:.06em;background:transparent}
.brandtxt{min-width:0;flex:1}
.brandtxt strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandtxt span{display:block;font-size:.8rem;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top select{background:rgba(255,255,255,.16);color:inherit;border:1px solid rgba(255,255,255,.4);border-radius:10px;min-height:40px;padding:0 8px;max-width:150px}
.top select option{color:#14202B}
.top .icon-btn{color:inherit}
#net{font-size:.72rem;font-weight:700;padding:4px 8px;border-radius:99px;background:var(--accent);color:var(--accent-ink);white-space:nowrap}

/* navegación */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:flex;gap:2px}
.nav button{flex:1;min-width:0;height:var(--navh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:0;color:var(--muted);font-size:.7rem;font-weight:600;cursor:pointer;border-radius:10px}
.nav button.on{color:var(--brand)}
.nav button.on svg{stroke-width:2.4}

/* botones y campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.btn.sm{min-height:40px;padding:0 12px}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.btn.accent{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-size:1.05rem}
.btn.danger{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn[disabled],.btn.off{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.icon-btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,.nav button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;border:0;background:transparent;cursor:pointer}
.icon-btn:hover{background:var(--surface2)}
.top .icon-btn:hover{background:rgba(255,255,255,.18)}
.field{display:grid;gap:6px;min-width:0}
.field>label,.lbl{font-size:.85rem;font-weight:600;color:var(--muted)}
input,select,textarea{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-width:0}
textarea{min-height:120px;font-family:var(--mono);font-size:.8rem}
input[type=color]{padding:4px;min-height:48px}
input[type=file]{padding:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}

/* tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;box-shadow:var(--shadow);min-width:0}
.card>h3+.sm{margin-top:-6px}
.empty{text-align:center;color:var(--muted);padding:20px 8px}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:.75rem;font-weight:700;background:var(--surface2);color:var(--muted)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.alert{border-radius:12px;padding:12px 14px;font-weight:600;display:grid;gap:2px}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.ok{background:var(--ok-bg);color:var(--ok)}
.alert.bad{background:var(--bad-bg);color:var(--bad)}
.alert span{font-weight:400}

/* segmentado */
.seg{display:flex;gap:4px;padding:4px;background:var(--surface2);border-radius:14px;overflow-x:auto}
.seg button{flex:1;min-height:42px;padding:0 14px;border:0;border-radius:10px;background:transparent;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

/* login */
.login{min-height:calc(100dvh - 40px);display:grid;place-items:center;padding-top:20px;padding-bottom:20px}
.login .card{width:min(100%,420px);padding:24px;gap:16px}
.login .brandline{display:flex;gap:12px;align-items:center}
.login .brandline .logo{background:var(--surface2);color:var(--fg)}
.errtxt{color:var(--bad);font-weight:600;min-height:1.2em}

/* POS */
.pos{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-items:start}
.hero{background:var(--brand);color:var(--brand-ink);border-radius:20px;padding:20px;display:grid;gap:12px}
.hero-l{font-size:1.35rem;font-weight:700}
.searchbox{display:flex;align-items:center;gap:10px;background:var(--surface);color:var(--fg);border-radius:14px;padding:0 14px;border:2px solid transparent}
.searchbox:focus-within{border-color:var(--accent)}
.searchbox input{border:0;background:transparent;min-height:56px;font-size:1.1rem;padding:0}
.searchbox input:focus-visible{outline:none}
.searchbox.small input{min-height:48px;font-size:1rem}
.hero .hint{font-size:.9rem;opacity:.9}
.results{display:grid;gap:12px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;box-shadow:var(--shadow)}
.prod-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.prod-h strong{font-size:1.05rem}
.price{font-weight:800;font-size:1.15rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.vars{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.var{display:flex;align-items:center;gap:8px;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px;background:var(--bg)}
.var.out{opacity:.55}
.var b{display:block}
.var small{color:var(--muted);font-size:.8rem}
.var small.low{color:var(--warn);font-weight:700}
.var .btn{min-height:44px;padding:0 14px}
.inc{background:var(--accent);color:var(--accent-ink);border-radius:99px;font-size:.75rem;font-weight:800;padding:1px 7px;margin-left:6px}
.cartbar{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(var(--navh) + 10px + env(safe-area-inset-bottom,0px));z-index:35;display:flex;align-items:center;gap:10px;min-height:56px;padding:0 18px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.cartbar strong{margin-left:auto;font-size:1.15rem}
.cartbar .go{font-weight:600;opacity:.8}
.scrim{position:fixed;inset:0;z-index:44;background:rgba(0,0,0,.5)}
.cartpanel{position:fixed;left:0;right:0;bottom:0;z-index:45;max-height:90%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;transform:translateY(105%);transition:transform .2s;visibility:hidden}
.cartpanel.open{transform:none;visibility:visible}
.cp-head{display:flex;justify-content:space-between;align-items:center}
.cart-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.cart-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}
.ci-main{display:grid;min-width:0}
.ci-main strong{overflow-wrap:anywhere}
.qty{display:flex;align-items:center;gap:2px}
.qty b{min-width:28px;text-align:center}
.ci-sub{grid-column:1/-1;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.tot{display:grid;gap:6px}
.tot div{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.tot .big{font-size:1.6rem;font-weight:800;padding-top:6px;border-top:2px solid var(--fg)}
.pays{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pay{min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;padding:0 8px}
.pay.on{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
@media (min-width:960px){
  .pos{grid-template-columns:minmax(0,1fr) 390px}
  .cartbar,.scrim{display:none!important}
  .cartpanel{position:sticky;top:calc(76px + env(safe-area-inset-top,0px));transform:none;visibility:visible;border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow);max-height:calc(100dvh - 160px);padding:16px}
  .cp-close{display:none}
}

/* listas */
.list{display:grid;gap:8px}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.item .grow{min-width:0;flex:1;display:grid}
.item .grow strong{overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;padding:3px 8px;border-radius:8px;background:var(--surface2);color:var(--fg)}
.chip.low{background:var(--warn-bg);color:var(--warn);font-weight:700}
.chip.zero{background:var(--bad-bg);color:var(--bad);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:2px}
.stat b{font-size:1.3rem;font-variant-numeric:tabular-nums}
details.row2{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.row2>summary{list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;cursor:pointer;min-height:56px}
details.row2>summary::-webkit-details-marker{display:none}
details.row2 .det{padding:0 12px 12px;display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.sumL{display:grid;min-width:0}
.sumR{display:flex;gap:8px;align-items:center;flex:none}
.sumR b{font-variant-numeric:tabular-nums}
.bars{display:grid;gap:10px}
.bar{display:grid;gap:4px}
.bar>div:first-child{display:flex;justify-content:space-between;gap:10px;font-size:.9rem}
.bar .track{height:12px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:var(--brand);border-radius:99px}
.picklist{display:grid;gap:8px}
.pickcard{display:flex;justify-content:space-between;gap:10px;align-items:center;border:2px solid var(--brand);border-radius:12px;padding:12px;background:var(--surface)}
.pickcard>div{display:grid;min-width:0}
.pickrow{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px;background:var(--bg)}
.pickrow>div{display:grid;min-width:0}
.vrow{display:grid;grid-template-columns:1fr 1fr 84px 44px;gap:8px;align-items:center}
.vlabels{display:grid;grid-template-columns:1fr 1fr 84px 44px;gap:8px;font-size:.78rem;font-weight:600;color:var(--muted)}
pre.code{margin:0;padding:12px;border-radius:12px;background:var(--surface2);font-family:var(--mono);font-size:.76rem;overflow:auto;max-height:260px;white-space:pre}
ol.steps{margin:0;padding-left:20px;display:grid;gap:6px}

/* modal y aviso */
#modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(100%,560px);max-height:94%;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
.sheet .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:700px){#modal{align-items:center}.sheet{border-radius:20px;padding:24px}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 80px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"></div>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
(() => {
'use strict';

/* ---------- Archivos de instalación (se muestran en Ajustes > Instalar) ---------- */
const SW_TEXT = "// Caja Boutique - service worker (cache primero, funciona sin internet)\nconst CACHE = 'caja-boutique-v1';\nconst ASSETS = ['./', './index.html', './manifest.json', './icon-192.png', './icon-512.png'];\n\nself.addEventListener('install', e => {\n  e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)).then(() => self.skipWaiting()));\n});\n\nself.addEventListener('activate', e => {\n  e.waitUntil(\n    caches.keys()\n      .then(keys => Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k))))\n      .then(() => self.clients.claim())\n  );\n});\n\nself.addEventListener('fetch', e => {\n  if (e.request.method !== 'GET') return;\n  e.respondWith(\n    caches.match(e.request, { ignoreSearch: true }).then(hit =>\n      hit || fetch(e.request).then(res => {\n        const copy = res.clone();\n        caches.open(CACHE).then(c => c.put(e.request, copy));\n        return res;\n      }).catch(() => caches.match('./index.html'))\n    )\n  );\n});\n";
const MANIFEST_TEXT = "{\n  \"name\": \"Caja Boutique - Punto de venta\",\n  \"short_name\": \"Caja\",\n  \"description\": \"Punto de venta, inventario y cambios para tienda de ropa. Funciona sin internet.\",\n  \"start_url\": \"./index.html\",\n  \"scope\": \"./\",\n  \"display\": \"standalone\",\n  \"display_override\": [\"fullscreen\", \"standalone\"],\n  \"orientation\": \"portrait\",\n  \"background_color\": \"#1E4D6B\",\n  \"theme_color\": \"#1E4D6B\",\n  \"lang\": \"es-MX\",\n  \"icons\": [\n    { \"src\": \"icon-192.png\", \"sizes\": \"192x192\", \"type\": \"image/png\", \"purpose\": \"any\" },\n    { \"src\": \"icon-512.png\", \"sizes\": \"512x512\", \"type\": \"image/png\", \"purpose\": \"any\" },\n    { \"src\": \"icon-512.png\", \"sizes\": \"512x512\", \"type\": \"image/png\", \"purpose\": \"maskable\" }\n  ]\n}\n";

/* ---------- Utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const KEY = 'cajaBoutique.v1', SES = 'cajaBoutique.session';
const mem = {};
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] ?? null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { mem[k] = v; return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { delete mem[k]; } }
};
function hash(s) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}
const pw = p => hash('cb$' + p + '$s1');
const IC = {
  cart: '<path d="M3 4h2l2.4 11h10.2L20 7H6.2"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/>',
  swap: '<path d="M4 8h14l-3-3M20 16H6l3 3"/>',
  box: '<path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/>',
  chart: '<path d="M4 20V4M4 20h16M8 16v-5M12 16V8M16 16v-3"/>',
  users: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5.2a3 3 0 0 1 0 5.6M18 14.3c1.8.8 3 2.6 3 4.7"/>',

/* ---------- Tema y marca ---------- */
function hex2rgb(h) { h = String(h || '').replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return isNaN(n) ? [30, 77, 107] : [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
const rgb2hex = a => '#' + a.map(x => Math.max(0, Math.min(255, Math.round(x))).toString(16).padStart(2, '0')).join('');
const lum = h => { const [r, g, b] = hex2rgb(h).map(x => { x /= 255; return x <= .03928 ? x / 12.92 : Math.pow((x + .055) / 1.055, 2.4); }); return .2126 * r + .7152 * g + .0722 * b; };
const inkFor = h => lum(h) > .4 ? '#10181F' : '#FFFFFF';
const lighten = (h, t) => rgb2hex(hex2rgb(h).map(x => x + (255 - x) * t));
function applyTheme(brand = DB.settings.brand, accent = DB.settings.accent) {
  const r = document.documentElement.style;
  const bd = lum(brand) < .3 ? lighten(brand, .45) : brand;
  r.setProperty('--brand-l', brand); r.setProperty('--brand-l-ink', inkFor(brand));
  r.setProperty('--brand-d', bd); r.setProperty('--brand-d-ink', inkFor(bd));
  r.setProperty('--accent', accent); r.setProperty('--accent-ink', inkFor(accent));
  const m = $('meta[name="theme-color"]'); if (m) m.setAttribute('content', brand);
}

function renderResults() {

function cartTotals() { const sub = S.cart.reduce((a, i) => a + i.price * i.qty, 0); const d = Math.min(Math.max(num(S.discount), 0), sub); return { sub, d, total: Math.round((sub - d) * 100) / 100 }; }
function renderCart() {
  const el = $('#cart'); if (!el) return;
  const n = S.cart.reduce((a, i) => a + i.qty, 0), t = cartTotals();
  el.classList.toggle('open', S.cartOpen); $('#scrim').hidden = !S.cartOpen;
  const bar = $('#cartbar'); bar.innerHTML = `${ico('cart')}<span>${n} ${n === 1 ? 'pieza' : 'piezas'}</span><strong>${money(t.total)}</strong><span class="go">Ver carrito</span>`; bar.hidden = n === 0 || S.cartOpen;

      <div class="qty"><button class="icon-btn" data-act="qty" data-i="${ix}" data-d="-1" aria-label="Quitar una pieza">${ico('minus', 18)}</button><b>${i.qty}</b><button class="icon-btn" data-act="qty" data-i="${ix}" data-d="1" aria-label="Agregar una pieza">${ico('plus', 18)}</button></div>
      <div class="ci-sub">${money(i.price * i.qty)}</div></li>`).join('')}</ul>` : `<p class="empty">El carrito está vacío.<br>Busca una prenda y toca “Agregar”.</p>`) +

    <button class="btn accent block ${S.cart.length ? '' : 'off'}" data-act="checkout">Cobrar</button>

function renderTotals() {
  const t = cartTotals(), el = $('#totals'); if (!el) return;
  el.innerHTML = `<div><span>Subtotal</span><span>${money(t.sub)}</span></div><div><span>Descuento</span><span>− ${money(t.d)}</span></div><div class="big"><span>Total</span><span>${money(t.total)}</span></div>`;
  const bar = $('#cartbar'); if (bar) { const n = S.cart.reduce((a, i) => a + i.qty, 0); const st = bar.querySelector('strong'); if (st) st.textContent = money(t.total); bar.hidden = n === 0 || S.cartOpen; }
  const ch = $('#change');
  if (ch) { const rec = num(S.cash); ch.innerHTML = S.cash !== '' && rec > 0 ? (rec >= t.total ? `<div class="alert ok">Cambio para el cliente<span style="font-size:1.4rem;font-weight:800">${money(rec - t.total)}</span></div>` : `<div class="alert bad">Falta dinero<span>Faltan ${money(t.total - rec)}</span></div>`) : ''; }
}
function addToCart(pid, vid) {
  const p = prod(pid), v = vari(p, vid); if (!p || !v) return;
  const it = S.cart.find(i => i.vid === vid), have = it ? it.qty : 0;
  if (have + 1 > stockOf(v)) { toast('No hay más piezas disponibles de esa talla'); return; }
  if (it) it.qty++; else S.cart.push({ pid, vid, name: p.name, size: v.size, color: v.color, price: p.price, qty: 1 });
  try { navigator.vibrate && navigator.vibrate(15); } catch (e) { /* sin vibración */ }
  renderResults(); renderCart();
}
function checkout() {
  if (!S.cart.length) { toast('Agrega al menos una prenda'); return; }
  const t = cartTotals();
  if (num(S.discount) > t.sub) { toast('El descuento no puede ser mayor al subtotal'); return; }
  if (S.method === 'credito' && !S.customer.trim()) { toast('Escribe el nombre del cliente para el fiado'); return; }
  for (const i of S.cart) { const v = vari(prod(i.pid), i.vid); if (!v || stockOf(v) < i.qty) { toast(`Ya no hay suficiente de ${i.name} talla ${i.size}`); return; } }
  S.cart.forEach(i => { const v = vari(prod(i.pid), i.vid); v.stock[S.branchId] = stockOf(v) - i.qty; });
  DB.seq.sale++;
  const sale = { id: uid(), folio: 'V-' + pad(DB.seq.sale), date: new Date().toISOString(), branchId: S.branchId, userId: S.user.id, userName: S.user.name,
    items: S.cart.map(i => ({ ...i })), subtotal: t.sub, discount: t.d, total: t.total, method: S.method, customer: S.method === 'credito' ? S.customer.trim() : '', received: S.method === 'efectivo' ? num(S.cash) : 0, creditPaid: false };
  DB.sales.push(sale); save();
  S.cart = []; S.discount = ''; S.cash = ''; S.customer = ''; S.cartOpen = false;
  receiptModal(sale); renderResults(); renderCart();
}
function receiptModal(s) {

  openModal(`<div class="alert ok">Venta registrada<span>${s.folio} · ${fmtDate(s.date)}</span></div>
  <ul class="list" style="list-style:none;margin:0;padding:0">${s.items.map(i => `<li class="item"><div class="grow"><strong>${i.qty} × ${esc(i.name)}</strong><span class="muted sm">Talla ${esc(i.size)} · ${esc(i.color)}</span></div><b>${money(i.price * i.qty)}</b></li>`).join('')}</ul>
  <div class="tot"><div><span>Subtotal</span><span>${money(s.subtotal)}</span></div><div><span>Descuento</span><span>− ${money(s.discount)}</span></div><div class="big"><span>Total</span><span>${money(s.total)}</span></div><div><span>Pago</span><span>${METHODS[s.method]}${s.customer ? ' · ' + esc(s.customer) : ''}</span></div>${change ? `<div><span>Cambio entregado</span><b>${money(change)}</b></div>` : ''}</div>

/* ---------- Cambios y devoluciones ---------- */
function exCalc() {
  const e = S.ex; if (!e.out || !e.in) return null;
  const po = prod(e.out.pid), pi = prod(e.in.pid); if (!po || !pi) return null;
  const qty = Math.max(1, parseInt(e.qty) || 1);
  const oldU = e.outPrice !== '' ? num(e.outPrice) : po.price;
  const oldT = oldU * qty, newT = pi.price * qty, diff = Math.round((newT - oldT) * 100) / 100;
  return { po, pi, qty, oldU, oldT, newT, diff, kind: diff < 0 ? 'menor' : diff > 0 ? 'mayor' : 'igual' };
}
function exchangeHTML() {
  const e = S.ex;

    return `<div class="card"><h3>${label}</h3><div class="searchbox small">${ico('search', 20)}<input data-in="exq" data-w="${w}" type="search" aria-label="${label}" placeholder="Nombre o código de la prenda" value="${esc(e[w === 'out' ? 'qOut' : 'qIn'])}"></div><div id="pick-${w}" class="picklist"></div></div>`;

function confirmExchange() {
  const c = exCalc(), e = S.ex; if (!c) { toast('Elige las dos prendas'); return; }
  if (e.out.vid === e.in.vid) { toast('Elige una prenda nueva distinta'); return; }
  const vOut = vari(c.po, e.out.vid), vIn = vari(c.pi, e.in.vid);
  if (stockOf(vIn) < c.qty) { toast('No hay suficientes piezas de la prenda nueva'); return; }
  if (c.kind === 'mayor' && e.method === 'credito' && !e.customer.trim()) { toast('Escribe el nombre del cliente para el fiado'); return; }
  vOut.stock[S.branchId] = stockOf(vOut) + c.qty;
  vIn.stock[S.branchId] = stockOf(vIn) - c.qty;
  DB.seq.ex++;
  const ex = { id: uid(), folio: 'C-' + pad(DB.seq.ex), date: new Date().toISOString(), branchId: S.branchId, userId: S.user.id, userName: S.user.name,
    out: { pid: c.po.id, vid: vOut.id, name: c.po.name, size: vOut.size, color: vOut.color, price: c.oldU }, in: { pid: c.pi.id, vid: vIn.id, name: c.pi.name, size: vIn.size, color: vIn.color, price: c.pi.price },
    qty: c.qty, diff: c.diff, kind: c.kind, charged: c.kind === 'mayor' ? c.diff : 0, method: c.kind === 'mayor' ? e.method : '', customer: c.kind === 'mayor' && e.method === 'credito' ? e.customer.trim() : '', note: e.note.trim(), creditPaid: false };
  DB.exchanges.push(ex); save();
  S.ex = newEx();
  openModal(`<div class="alert ${c.kind === 'menor' ? 'warn' : 'ok'}">Cambio registrado<span>${ex.folio} · ${fmtDate(ex.date)}</span></div>
  <div class="list"><div class="item"><div class="grow"><span class="eyebrow">Regresó</span><strong>${ex.qty} × ${esc(ex.out.name)}</strong><span class="muted sm">Talla ${esc(ex.out.size)} · ${esc(ex.out.color)}</span></div></div><div class="item"><div class="grow"><span class="eyebrow">Se lleva</span><strong>${ex.qty} × ${esc(ex.in.name)}</strong><span class="muted sm">Talla ${esc(ex.in.size)} · ${esc(ex.in.color)}</span></div></div></div>
  ${c.kind === 'menor' ? `<div class="alert warn">No hay devolución de diferencia al cliente</div>` : c.kind === 'igual' ? `<div class="alert ok">Costo del cambio: ${money(0)}</div>` : `<div class="alert ok">Cobrado: ${money(ex.charged)}<span>${METHODS[ex.method]}${ex.customer ? ' · ' + esc(ex.customer) : ''}</span></div>`}
  <button class="btn primary block" data-act="modal-close">Listo</button>`);
  renderMain();
}

function metricsHTML() {
  const sales = pf(DB.sales), exs = pf(DB.exchanges);

  const byM = {}; sales.forEach(s => { byM[s.method] = (byM[s.method] || 0) + s.total; }); exs.forEach(x => { if (x.method) byM[x.method] = (byM[x.method] || 0) + x.charged; });
  const top = {}; sales.forEach(s => s.items.forEach(i => { top[i.name] = (top[i.name] || 0) + i.qty; }));
  const topRows = Object.entries(top).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const byB = {}; sales.forEach(s => { byB[branchName(s.branchId)] = (byB[branchName(s.branchId)] || 0) + s.total; });
  const lows = []; DB.products.forEach(p => p.variants.forEach(v => { const st = stockOf(v); if (st <= DB.settings.low) lows.push({ p, v, st }); })); lows.sort((a, b) => a.st - b.st);
  const debtors = {}; DB.sales.filter(s => s.method === 'credito' && !s.creditPaid).forEach(s => { debtors[s.customer] = (debtors[s.customer] || 0) + s.total; }); DB.exchanges.filter(x => x.method === 'credito' && !x.creditPaid).forEach(x => { debtors[x.customer] = (debtors[x.customer] || 0) + x.charged; });
  return `<div class="stats"><div class="stat"><span class="muted sm">Ventas</span><b>${money(tot)}</b></div><div class="stat"><span class="muted sm">Tickets</span><b>${sales.length}</b></div><div class="stat"><span class="muted sm">Ticket promedio</span><b>${money(sales.length ? tot / sales.length : 0)}</b></div><div class="stat"><span class="muted sm">Piezas vendidas</span><b>${pieces}</b></div><div class="stat"><span class="muted sm">Descuentos dados</span><b>${money(disc)}</b></div><div class="stat"><span class="muted sm">Cobrado en cambios</span><b>${money(exCharged)}</b></div><div class="stat"><span class="muted sm">Fiado pendiente</span><b>${money(fiadoPend)}</b></div></div>
  <div class="card"><h3>Por método de pago</h3>${bars(Object.entries(byM).map(([k, v]) => [METHODS[k], v]), money)}</div>
  <div class="card"><h3>Más vendidos</h3>${bars(topRows, n => n + ' pz')}</div>
  ${DB.branches.length > 1 ? `<div class="card"><h3>Por sucursal</h3>${bars(Object.entries(byB), money)}</div>` : ''}
  <div class="card"><h3>Stock bajo en ${esc(branchName(S.branchId))}</h3><div class="list">${lows.length ? lows.slice(0, 12).map(({ p, v, st }) => `<div class="item"><div class="grow"><strong>${esc(p.name)}</strong><span class="muted sm">Talla ${esc(v.size)} · ${esc(v.color)}</span></div><span class="badge ${st <= 0 ? 'bad' : 'warn'}">${st <= 0 ? 'Agotado' : st + ' pzas'}</span></div>`).join('') : `<div class="empty">Todo con existencias suficientes.</div>`}</div></div>
  <div class="card"><h3>Clientes con fiado pendiente</h3><div class="list">${Object.keys(debtors).length ? Object.entries(debtors).map(([n, v]) => `<div class="item"><strong>${esc(n)}</strong><b>${money(v)}</b></div>`).join('') : `<div class="empty">Nadie debe en este momento.</div>`}</div></div>`;
}

function processLogo(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => { const img = new Image(); img.onload = () => {
    const sc = Math.min(1, 256 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    DB.settings.logo = c.toDataURL('image/png'); save(); render(); toast('Logo actualizado');
  }; img.onerror = () => toast('No se pudo leer esa imagen'); img.src = r.result; };
  r.onerror = () => toast('No se pudo leer el archivo'); r.readAsDataURL(file);
}
function exportDB() {
  const json = JSON.stringify(DB, null, 2), name = 'respaldo-caja-' + new Date().toISOString().slice(0, 10) + '.json';
  try { const u = URL.createObjectURL(new Blob([json], { type: 'application/json' })); const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 3000); } catch (e) { /* se muestra el texto abajo */ }
  DB.settings.lastBackup = new Date().toISOString(); save();
  openModal(`<h2>Respaldo listo</h2><p>Se intentó descargar <b>${name}</b>. Si no apareció el archivo, copia este texto y guárdalo como .json.</p><textarea id="exptxt" readonly>${esc(json)}</textarea><div class="acts"><button class="btn" data-act="copy" data-t="exptxt">Copiar texto</button><button class="btn primary" data-act="modal-close">Cerrar</button></div>`);
}
function importText(text) {
  let d; try { d = JSON.parse(text); } catch (e) { toast('El texto no es un respaldo válido'); return; }
  if (!d || !Array.isArray(d.users) || !d.users.length || !Array.isArray(d.products) || !Array.isArray(d.branches) || !d.branches.length) { toast('Ese archivo no parece un respaldo de esta app'); return; }
  ask('¿Reemplazar los datos?', `Se cargarán ${d.products.length} productos, ${(d.sales || []).length} ventas y ${d.users.length} usuarios. Lo que hay ahora se reemplaza.`, 'Sí, importar', () => {
    DB = fixDB(d); save(); applyTheme(); closeModal();
    const u = DB.users.find(x => x.id === (S.user && S.user.id));
    if (u) { S.user = u; if (!DB.branches.some(b => b.id === S.branchId)) S.branchId = DB.branches[0].id; render(); } else endSession();
    toast('Respaldo importado');
  }, false);
}
async function copyFrom(id) {
  const el = document.getElementById(id); if (!el) return;
  const text = el.value !== undefined ? el.value : el.textContent;
  try { await navigator.clipboard.writeText(text); toast('Copiado'); }
  catch (e) { try { if (el.select) el.select(); else { const r = document.createRange(); r.selectNodeContents(el); const g = getSelection(); g.removeAllRanges(); g.addRange(r); } } catch (e2) { /* nada */ } toast('Selecciona el texto y cópialo'); }
}

/* ---------- Formularios ---------- */
const FORM = {
  login: f => {
    const u = DB.users.find(x => norm(x.user) === norm(f.user.value));
    if (!u || u.pass !== pw(f.pass.value)) { $('#lerr').textContent = 'Usuario o contraseña incorrectos'; return; }
    startSession(u); render();
  },
  saveProduct: f => {
    const id = f.dataset.id, name = f.name.value.trim(), price = num(f.price.value);
    if (!name) { toast('Escribe el nombre del modelo'); return; }
    if (!(price >= 0) || f.price.value.trim() === '') { toast('Escribe el precio de venta'); return; }
    let code = f.code.value.trim();
    if (code && DB.products.some(p => p.id !== id && norm(p.code) === norm(code))) { toast('Ya existe un producto con ese código'); return; }
    const rows = [...f.querySelectorAll('.vrow')].map(r => ({ vid: r.dataset.vid, size: r.querySelector('[name=size]').value.trim(), color: r.querySelector('[name=color]').value.trim(), st: Math.max(0, parseInt(r.querySelector('[name=stock]').value) || 0) })).filter(r => r.size || r.color);
    if (!rows.length) { toast('Agrega al menos una talla o color'); return; }
    const old = id ? prod(id) : null;
    const variants = rows.map(r => { const ov = old && vari(old, r.vid); const stock = ov ? { ...ov.stock } : {}; stock[S.branchId] = r.st; return { id: ov ? ov.id : uid(), size: r.size || '—', color: r.color || '—', stock }; });
    if (old) { Object.assign(old, { name, code: code || old.code, categoryId: f.cat.value, price, cost: num(f.cost.value), variants }); }
    else { if (!code) code = 'P' + pad(++DB.seq.prod); DB.products.push({ id: uid(), code, name, categoryId: f.cat.value, price, cost: num(f.cost.value), variants }); }
    save(); closeModal(); renderMain(); toast('Producto guardado');
  },
  saveCat: f => {
    const name = f.name.value.trim(); if (!name) return;
    if (DB.categories.some(c => c.id !== f.dataset.id && norm(c.name) === norm(name))) { toast('Ya existe esa categoría'); return; }
    if (f.dataset.id) DB.categories.find(c => c.id === f.dataset.id).name = name; else DB.categories.push({ id: uid(), name });
    save(); closeModal(); renderMain(); toast('Categoría guardada');
  },
  saveUser: f => {
    const id = f.dataset.id, name = f.name.value.trim(), user = f.user.value.trim(), pass = f.pass.value;
    if (!name || !user) { toast('Completa nombre y usuario'); return; }
    if (DB.users.some(u => u.id !== id && norm(u.user) === norm(user))) { toast('Ese usuario ya existe'); return; }
    if (!id && pass.length < 4) { toast('La contraseña debe tener al menos 4 caracteres'); return; }
    if (id && pass && pass.length < 4) { toast('La contraseña debe tener al menos 4 caracteres'); return; }
    if (id) {
      const u = DB.users.find(x => x.id === id);
      if (u.role === 'admin' && f.role.value !== 'admin' && DB.users.filter(x => x.role === 'admin').length < 2) { toast('Debe quedar al menos un administrador'); return; }
      Object.assign(u, { name, user, role: f.role.value, branchId: f.branch.value }); if (pass) { u.pass = pw(pass); u.def = false; }
      if (u.id === S.user.id) { S.user = u; }
    } else DB.users.push({ id: uid(), name, user, pass: pw(pass), role: f.role.value, branchId: f.branch.value });
    save(); closeModal(); render(); toast('Empleado guardado');
  },
  saveBranch: f => {
    const name = f.name.value.trim(); if (!name) return;
    if (f.dataset.id) DB.branches.find(b => b.id === f.dataset.id).name = name; else DB.branches.push({ id: uid(), name });
    save(); closeModal(); render(); toast('Sucursal guardada');
  },
  saveSettings: f => {
    Object.assign(DB.settings, { storeName: f.storeName.value.trim() || 'Mi Tienda', brand: f.brand.value, accent: f.accent.value, currency: f.currency.value.trim() || '$', low: Math.max(0, parseInt(f.low.value) || 0), footer: f.footer.value.trim() });
    save(); applyTheme(); render(); toast('Cambios guardados');
  },
  changePw: f => {
    if (S.user.pass !== pw(f.old.value)) { toast('La contraseña actual no es correcta'); return; }
    if (f.new.value.length < 4) { toast('Usa al menos 4 caracteres'); return; }
    S.user.pass = pw(f.new.value); S.user.def = false; save(); f.reset(); toast('Contraseña actualizada');
  }
};
document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); const h = FORM[f.dataset.form]; if (h) h(f); });

/* ---------- Conexión y arranque ---------- */
function netState() { const n = $('#net'); if (n) n.hidden = navigator.onLine; }
window.addEventListener('online', netState); window.addEventListener('offline', netState);
load(); applyTheme();
const sid = store.get(SES), su = sid && DB.users.find(u => u.id === sid);
if (su) startSession(su);
render();
try { if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('service-worker.js').catch(() => {}); } catch (e) { /* sin service worker en esta vista */ }
})();
</script>
